sonar.projectKey=real-time-sales-devops
sonar.projectName=Real-Time Sales DevOps TP

# Code analysé : l'API et le job Spark streaming
sonar.sources=app,spark
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Couverture mesurée par les tests unitaires
sonar.python.coverage.reportPaths=coverage.xml
# Le job Spark est validé par les tests d'intégration et E2E, pas par les tests unitaires
sonar.coverage.exclusions=spark/**

# Résultats des tests unitaires affichés dans SonarQube
sonar.python.xunit.reportPath=test-results-unit.xml

sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**